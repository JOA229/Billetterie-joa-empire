<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contrôle à l'entrée</title>
<style>
  body { font-family:system-ui,sans-serif; margin:0; padding:24px 16px; display:flex; flex-direction:column; align-items:center; background:#fbfaf7; color:#15181f; }
  main { width:100%; max-width:420px; display:grid; gap:14px; }
  h1 { font-size:26px; margin:0; }
  input, button { font:inherit; padding:16px; border-radius:6px; border:2px solid #15181f; }
  button { background:#1b3fc4; color:#fff; border-color:#1b3fc4; font-weight:700; cursor:pointer; }
  #res { padding:20px; border-radius:6px; font-size:22px; font-weight:700; display:none; text-align:center; }
  .bon { background:#1c8a3c; color:#fff; } .mauvais { background:#b3261e; color:#fff; }
</style>
</head>
<body>
<main>
  <h1>Contrôle à l'entrée</h1>
  <input id="pin" type="password" placeholder="Ton code PIN" inputmode="numeric" autocomplete="off">
  <input id="code" placeholder="Code du billet (VOD-XXXXXXXX)" autocapitalize="characters" autocomplete="off">
  <button id="ok">Vérifier le billet</button>
  <div id="res" role="status"></div>
</main>
<script>
  document.getElementById("ok").onclick = async () => {
    const pin = document.getElementById("pin").value, code = document.getElementById("code").value;
    const res = document.getElementById("res");
    res.style.display = "block"; res.className = ""; res.textContent = "Vérification...";
    try {
      const r = await fetch("/.netlify/functions/controle?pin=" + encodeURIComponent(pin) + "&code=" + encodeURIComponent(code));
      const d = await r.json();
      res.className = d.valide ? "bon" : "mauvais";
      res.textContent = (d.valide ? "Valide : " : "Refusé : ") + (d.message || "") + (d.nom ? " (" + d.nom + ")" : "");
    } catch (e) { res.className = "mauvais"; res.textContent = "Erreur de connexion"; }
  };
</script>
</body>
</html>
